<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嗜茶人 - 專屬風味占卜</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap');
      
      :root { 
        --ink-green: #2F3E35; --ink-black: #222222; --tea-gold: #B09B71; 
        --paper-bg: #F4F1EA; --stamp-red: #A93828; --border-gray: rgba(213, 207, 196, 0.6); 
      }
      
      body { 
        font-family: 'Noto Serif TC', '微軟正黑體', serif; background-color: var(--paper-bg); 
        background-image: 
          url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"), 
          linear-gradient(to right, var(--border-gray) 1px, transparent 1px), 
          linear-gradient(to bottom, var(--border-gray) 1px, transparent 1px); 
        background-size: 100px 100px, 60px 60px, 60px 60px; background-position: center top; 
        color: var(--ink-black); padding: 50px 20px; margin: 0; 
        display: flex; justify-content: center; overflow-x: hidden; position: relative; 
      }
      
      .leaves-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
      .leaf { 
        position: absolute; width: 35px; height: 35px; 
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232F3E35' opacity='0.15'><path d='M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C14,8 16.25,9.75 17,8Z'/></svg>"); 
        background-size: contain; background-repeat: no-repeat; 
        animation: sway 12s ease-in-out infinite, fall 18s linear infinite; 
      }
      @keyframes sway { 0%, 100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(60px) rotate(45deg); } }
      @keyframes fall { 0% { top: -10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 110%; opacity: 0; } }
      .leaf:nth-child(1) { left: 15%; animation-delay: 0s, 0s; transform: scale(0.9); } 
      .leaf:nth-child(2) { left: 35%; animation-delay: 3s, 5s; transform: scale(1.3); } 
      .leaf:nth-child(3) { left: 60%; animation-delay: 6s, 2s; transform: scale(0.8); } 
      .leaf:nth-child(4) { left: 80%; animation-delay: 9s, 7s; transform: scale(1.1); } 
      .leaf:nth-child(5) { left: 95%; animation-delay: 2s, 11s; transform: scale(1); }
      
      .tea-master-illustration { position: fixed; bottom: 0; left: 2%; width: 350px; height: 350px; pointer-events: none; z-index: 0; opacity: 0.85; }
      @keyframes pour { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      @keyframes steam-rise { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(-20px) scale(1.2); opacity: 0; } }
      .water-stream { stroke-dasharray: 6 4; animation: pour 0.8s linear infinite; } 
      .steam-wave { animation: steam-rise 3s ease-in-out infinite; transform-origin: center bottom; } .steam-wave:nth-child(2) { animation-delay: 1.5s; }
      
      .container { 
        background-color: rgba(253, 252, 248, 0.95); backdrop-filter: blur(8px); 
        max-width: 550px; width: 100%; padding: 50px 40px; position: relative; 
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08); border: 1px solid var(--border-gray); z-index: 1; 
      }
      .container::before, .container::after { content: ''; position: absolute; width: 30px; height: 30px; border: 1px solid var(--tea-gold); } 
      .container::before { top: 15px; left: 15px; border-right: none; border-bottom: none; } 
      .container::after { bottom: 15px; right: 15px; border-left: none; border-top: none; }
      
      .stamp { 
        position: absolute; top: 30px; right: 30px; width: 32px; height: 80px; 
        background-color: var(--stamp-red); color: white; font-family: 'Noto Serif TC', serif; 
        font-weight: 900; font-size: 16px; writing-mode: vertical-rl; text-align: center; 
        letter-spacing: 2px; display: flex; align-items: center; justify-content: center; 
        border-radius: 2px; opacity: 0.85; 
      }
      
      h2 { text-align: center; color: var(--ink-green); font-size: 28px; margin-top: 10px; margin-bottom: 15px; letter-spacing: 3px; font-weight: 600; }
      .subtitle { text-align: center; font-size: 15px; color: #666; margin-bottom: 40px; line-height: 1.8; letter-spacing: 1px; transition: 0.3s; }
      
      .form-group { margin-bottom: 30px; }
      label { display: block; font-weight: 600; margin-bottom: 10px; font-size: 15px; color: var(--ink-green); letter-spacing: 1px; }
      select, input { 
        width: 100%; padding: 8px 5px; box-sizing: border-box; border: none; 
        border-bottom: 1px solid var(--border-gray); border-radius: 0; font-size: 16px; 
        background-color: transparent; color: var(--ink-black); font-family: 'Noto Serif TC', serif; 
        transition: border-color 0.3s ease; appearance: none; 
      }
      select { 
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23B09B71%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); 
        background-repeat: no-repeat; background-position: right 5px center; background-size: 10px; 
      }
      select:focus, input:focus { outline: none; border-bottom: 2px solid var(--ink-green); }
      
      button.submit-btn { 
        background-color: var(--ink-green); color: var(--paper-bg); padding: 16px 20px; 
        border: 1px solid var(--ink-green); cursor: pointer; width: 100%; font-size: 18px; 
        font-family: 'Noto Serif TC', serif; letter-spacing: 4px; font-weight: 600; 
        transition: all 0.4s; margin-top: 20px; 
      }
      button.submit-btn:hover { background-color: transparent; color: var(--ink-green); }
      
      #output { display: none; animation: fadeIn 0.8s ease-in; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      .audio-controller { 
        position: fixed; bottom: 30px; right: 30px; background-color: var(--paper-bg); 
        border: 1px solid var(--tea-gold); color: var(--ink-green); padding: 12px 18px; 
        border-radius: 40px; font-size: 14px; font-family: 'Noto Serif TC', serif; 
        font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        transition: all 0.3s ease; z-index: 10; display: flex; align-items: center; gap: 8px; 
      }
      .audio-controller:hover { background-color: var(--ink-green); color: var(--paper-bg); border-color: var(--ink-green); }

      /* 指南文字與卡片樣式 */
      .guide-box {
        text-align: left; background-color: rgba(253, 252, 248, 0.8); border: 1px solid var(--tea-gold); 
        padding: 20px; margin-bottom: 25px; border-radius: 4px; font-size: 15px; line-height: 1.8;
      }
      .guide-box ul { margin: 10px 0 0; padding-left: 20px; color: #444; }
      .guide-box li { margin-bottom: 8px; }
      
      .result-card-container {
        margin: 20px 0 30px; text-align: center;
      }
      .result-card-container img {
        max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        transition: transform 0.3s ease;
      }
      .result-card-container img:hover { transform: translateY(-5px); }
      
      /* 下載按鈕樣式 */
      .download-btn {
        display: inline-block; margin-top: 15px; padding: 10px 20px; 
        background-color: var(--tea-gold); color: #fff; text-decoration: none; 
        border-radius: 4px; font-size: 15px; letter-spacing: 2px; 
        transition: 0.3s; box-shadow: 0 4px 10px rgba(176, 155, 113, 0.3);
      }
      .download-btn:hover { background-color: var(--ink-green); color: #fff; }

      /* 品牌介紹區塊進階排版樣式 */
      .brand-intro-box {
        background-color: rgba(248, 249, 250, 0.85); padding: 25px 20px; border-radius: 6px; 
        border-top: 4px solid var(--ink-green); text-align: left; margin: 35px 0; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      }
      .brand-intro-box h4 { 
        text-align: center; margin-top: 0; margin-bottom: 20px; color: var(--ink-green); 
        font-size: 18px; letter-spacing: 2px; border-bottom: 1px solid var(--border-gray); padding-bottom: 15px;
      }
      .brand-section { margin-bottom: 18px; }
      .brand-section:last-child { margin-bottom: 0; }
      .brand-section h5 { margin: 0 0 5px 0; color: var(--tea-gold); font-size: 15px; letter-spacing: 1px; }
      .brand-section p { margin: 0; color: #444; font-size: 14px; line-height: 1.8; text-align: justify; }

      /* 製造商資訊樣式 */
      .manufacturer-info {
        text-align: center; color: #666; font-size: 13px; margin-top: 30px; line-height: 1.6;
        border-top: 1px dotted var(--border-gray); padding-top: 15px;
      }
      
      @media (max-width: 900px) { .tea-master-illustration { opacity: 0.15; left: -50px; } }
      @media (max-width: 600px) { .container { padding: 40px 25px; } .stamp { top: 20px; right: 20px; width: 28px; height: 70px; font-size: 14px; } }
    </style>
  </head>
  <body>

    <!-- 大自然樹葉背景 -->
    <div class="leaves-container">
      <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
    </div>
    
    <!-- 司茶人插圖 -->
    <svg class="tea-master-illustration" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path class="steam-wave" d="M305,210 Q315,180 295,150" stroke="#B09B71" stroke-width="2" stroke-linecap="round"/>
      <path class="steam-wave" d="M325,220 Q340,190 320,160" stroke="#B09B71" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M290,340 L340,340 C345,340 350,330 345,310 C340,290 295,290 290,310 C285,330 285,340 290,340 Z" stroke="#2F3E35" stroke-width="2.5" stroke-linejoin="round"/>
      <path class="water-stream" d="M275,270 Q285,300 310,325" stroke="#B09B71" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M220,240 C210,210 260,210 270,240 C280,270 200,270 220,240 Z" stroke="#2F3E35" stroke-width="3" stroke-linejoin="round"/>
      <path d="M265,245 Q285,240 285,265" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M215,245 Q195,250 205,270" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M60,400 C60,330 110,270 180,270 C200,270 210,275 220,285" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M120,270 C150,250 180,250 205,265" stroke="#2F3E35" stroke-width="2" stroke-linecap="round"/>
      <path d="M50,400 C50,290 80,180 120,150 C140,135 170,135 180,165 C185,180 170,195 160,205" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M120,150 C110,130 125,100 155,95 C175,90 190,110 180,135" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M180,165 Q195,175 185,195 L170,210" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M165,155 Q175,155 175,160" stroke="#2F3E35" stroke-width="2" stroke-linecap="round"/> 
    </svg>
    
    <button class="audio-controller" id="audioBtn" onclick="toggleAudio()">
      <span id="audioIcon">🌿</span> <span id="audioText">聆聽茶園微風</span>
    </button>

    <div class="container">
      <div class="stamp" id="stampMarker">嗜茶人</div>
      <h2 id="mainTitle">找出命定茶款</h2>
      <p class="subtitle" id="subTitle">依循日常品飲軌跡，尋得屬於您的那一葉茶香。</p>
      
      <!-- 測驗表單 -->
      <form id="teaForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group"><label>一、 您的稱呼：</label><input type="text" name="name" required placeholder="如：王先生 / 李小姐"></div>
        <div class="form-group"><label>二、 接收結果的電子信箱：</label><input type="email" name="email" required placeholder="example@email.com"></div>
        
        <div style="text-align: center; margin: 40px 0;">
          <span style="display: inline-block; width: 40px; height: 1px; background-color: var(--tea-gold); vertical-align: middle;"></span>
          <span style="color: var(--tea-gold); margin: 0 10px; font-size: 12px;">尋茶</span>
          <span style="display: inline-block; width: 40px; height: 1px; background-color: var(--tea-gold); vertical-align: middle;"></span>
        </div>

        <div class="form-group"><label>三、 飲茶時，您偏好何種感官體驗？</label>
          <select name="taste"><option>清爽解渴無負擔</option><option>濃郁夠味有層次</option></select>
        </div>
        <div class="form-group"><label>四、 日常習慣的茶湯溫度？</label>
          <select name="brew"><option>冰涼冷泡</option><option>溫暖熱泡</option></select>
        </div>
        <div class="form-group"><label>五、 沖泡茶葉的情境通常為？</label>
          <select name="format"><option>追求快速便利 (茶包)</option><option>享受沖泡儀式 (原葉)</option></select>
        </div>
        <div class="form-group"><label>六、 關於香氣，您更傾向哪一種？</label>
          <select name="roast"><option>植物原始的自然清新</option><option>帶有烘焙、焦糖的熟香</option></select>
        </div>
        <div class="form-group"><label>七、 您期盼這杯茶帶來什麼樣的風景？</label>
          <select name="expectation">
            <option>清雅幽長的花香風味</option>
            <option>高山雲霧的細緻冷香</option>
            <option>天然醇厚的甘甜蜜香</option>
            <option>日常百搭的解膩良伴</option>
          </select>
        </div>
        
        <button type="submit" class="submit-btn">獲取專屬茶款</button>
      </form>
      
      <!-- 結果顯示區塊 (預設隱藏) -->
      <div id="output"></div>
    </div>

    <script>
      // === 音效播放邏輯 ===
      var music = null; 
      var isPlaying = false;
      var audioBtn = document.getElementById("audioBtn");
      var audioText = document.getElementById("audioText");
      var audioIcon = document.getElementById("audioIcon");

      function toggleAudio() {
        if (!music) {
          music = new Audio("./wind.mp3"); 
          music.loop = true;
          music.volume = 0.3;
        }
        if (isPlaying) {
          music.pause();
          audioText.innerText = "聆聽茶園微風";
          audioIcon.innerText = "🌿";
          isPlaying = false;
        } else {
          music.play().then(function() {
            audioText.innerText = "靜心品茗中";
            audioIcon.innerText = "🎵";
            isPlaying = true;
          }).catch(function(error) {
            alert("系統提示：音效播放失敗。請確認 GitHub 上是否存在 wind.mp3 檔案。");
          });
        }
      }

      // === 表單送出與前端畫面渲染邏輯 ===
      function handleFormSubmit(event) {
        event.preventDefault();
        
        var form = document.getElementById('teaForm');
        var outputDiv = document.getElementById('output');
        var mainTitle = document.getElementById('mainTitle');
        var subTitle = document.getElementById('subTitle');
        
        // 1. 取得使用者輸入的值
        var name = event.target.name.value;
        var emailInput = event.target.email.value;
        var expectation = event.target.expectation.value;
        var roast = event.target.roast.value;
        var taste = event.target.taste.value;
        var brew = event.target.brew.value;
        var format = event.target.format.value;
        
        // 2. 執行與後端一致的邏輯判定，並綁定對應的圖片檔名
        var teaResult = "";
        var teaReason = "";
        var cardImageName = "";
        
        if (expectation === "清雅幽長的花香風味") {
          teaResult = "文山包種茶";
          teaReason = "包種茶屬於輕發酵青茶。透過獨特的輕度萎凋工藝，保留並激發天然的揮發性花香物質。茶湯帶有清雅的蘭花香氣，適合追求細緻花香與清新氣息的您。";
          cardImageName = "card_baozhong.png";
        } else if (expectation === "高山雲霧的細緻冷香" && roast === "植物原始的自然清新") {
          teaResult = "清香高山烏龍";
          teaReason = "高山環境日照較短，保留了 L-茶胺酸，降低苦澀。茶湯具獨特「冷礦香」，口感鮮爽甘甜，符合您對純淨風味的期待。";
          cardImageName = "card_highmountain.png";
        } else if (taste === "清爽解渴無負擔" && brew === "冰涼冷泡") {
          teaResult = "特色茶枝";
          teaReason = "茶枝部位咖啡因與單寧酸極低，富含天然游離糖。冷飲沖泡減少苦澀，展現純粹甘甜，是清爽無負擔的最佳選擇。";
          cardImageName = "card_teastem.png";
        } else if (expectation === "天然醇厚的甘甜蜜香" || taste === "濃郁夠味有層次") {
          teaResult = "蜜香紅茶";
          teaReason = "全發酵工藝帶來厚實醇和口感。受小綠葉蟬叮咬產生的芳樟醇，完美釋放天然蜜香，適合喜愛濃郁層次風味的您。";
          cardImageName = "card_blacktea.png";
        } else if (roast === "帶有烘焙、焦糖的熟香") {
          teaResult = "精焙烏龍";
          teaReason = "經高溫烘焙產生梅納反應，轉化出溫潤的焙火香與焦糖香，茶湯醇厚溫和，適合鍾愛成熟風味的您。";
          cardImageName = "card_roastedoolong.png";
        } else {
          teaResult = "經典清香烏龍";
          teaReason = "保留豐富兒茶素與植物清新香氣，入喉生津止渴，是日常百搭的絕佳選擇。";
          cardImageName = "card_oolong.png";
        }

        // 3. 動態產生職人級沖泡指示
        var guideHtml = "";
        
        if (brew === "冰涼冷泡") {
          guideHtml = `
            <ul>
              <li><strong>水溫：</strong>常溫水或冷水即可。</li>
              <li><strong>比例：</strong>1g 茶葉對應 100ml 水。</li>
              <li><strong>時間：</strong>置於冰箱冷藏 6-8 小時風味最佳。</li>
            </ul>`;
        } else {
          // 針對原葉熱泡，套用客製化參數
          if (format === "享受沖泡儀式 (原葉)") {
            if (teaResult === "文山包種茶") {
              guideHtml = `
                <ul>
                  <li><strong>水溫：</strong>建議 95°C 熱水。</li>
                  <li><strong>比例：</strong>茶水比約 1:50。</li>
                  <li><strong>時間：</strong>第一泡 30 秒，第二泡 25 秒，第三泡 30 秒。</li>
                </ul>`;
            } else if (teaResult === "蜜香紅茶") {
              guideHtml = `
                <ul>
                  <li><strong>水溫：</strong>建議 85°C 熱水。</li>
                  <li><strong>比例：</strong>茶水比約 1:50。</li>
                  <li><strong>時間：</strong>第一泡 25 秒，第二泡 30 秒，第三泡 25 秒。</li>
                </ul>`;
            } else if (teaResult === "清香高山烏龍") {
              guideHtml = `
                <ul>
                  <li><strong>水溫：</strong>需使用 100°C 滾水。</li>
                  <li><strong>比例：</strong>100cc 水量搭配 6-8g 茶葉。</li>
                  <li><strong>時間：</strong>第一泡 120 秒，後續每次增加 60 秒。</li>
                </ul>`;
            } else {
              guideHtml = `
                <ul>
                  <li><strong>水溫：</strong>建議 90°C - 95°C 沸水。</li>
                  <li><strong>比例：</strong>茶葉鋪滿壺底一層，約 1g 對應 30ml 水。</li>
                  <li><strong>時間：</strong>首泡 40-50 秒，後續每泡增加 10-15 秒，可回沖 4-6 次。</li>
                </ul>`;
            }
          } else {
            // 熱泡茶包通用參數
            guideHtml = `
              <ul>
                <li><strong>水溫：</strong>建議 90°C - 95°C 沸水。</li>
                <li><strong>水量：</strong>注入約 250ml - 300ml 熱水。</li>
                <li><strong>時間：</strong>靜置 3-5 分鐘後將茶包取出，避免久浸苦澀。</li>
              </ul>`;
          }
        }

        // 動態生成專屬結果卡的網址 (以當前目錄為準)
        var resultCardUrl = "./" + cardImageName;

        // 4. 動態加入「鑫利發茶園」詳細品牌介紹 (僅針對自家茶品)
        var brandIntroHtml = "";
        if (teaResult === "文山包種茶" || teaResult === "蜜香紅茶" || teaResult === "特色茶枝") {
          brandIntroHtml = `
            <div class="brand-intro-box">
              <h4>🌿 鑫利發茶園 (Xin Li Fa Tea Garden)</h4>
              
              <div class="brand-section">
                <h5>【品牌概述】</h5>
                <p>深耕於新北市坪林區水德里，是一座傳承超過半世紀歷史的在地茶園。茶園秉持「杯杯用心，杯杯精品」的製茶理念，將深厚的製茶技藝融合新世代企業管理與數位化思維，致力於將坪林風土與台灣精品茶推向國內外市場。</p>
              </div>

              <div class="brand-section">
                <h5>【核心特色與工藝】</h5>
                <p>主力生產正統文山包種茶（原葉及茶包）、蜜香紅茶（原葉及茶包）以及各式焙火特色茶款（如焙香茶穗茶包），並專注於茶葉烘焙控溫、發酵化學及茶葉副產物（如茶枝）的風味轉化。同時堅持保存並推廣瀕臨斷代的「傳統紙包茶」古法包裝技術，並落實衛福部食藥署登錄與產品合規檢驗，推動茶產業透明化與現代化轉型。</p>
              </div>

              <div class="brand-section">
                <h5>【國際榮譽與賽事】</h5>
                <p>旗下明星品項「焙香茶穗 (Roasted Cha-Sui)」、「鑫利發紅茶榮獲」 2026、2025 英國 Great Taste Awards 國際美味大賽二星獎（2-STAR）殊榮，製茶工藝與風味品質獲得國際評審高度肯定。</p>              </div>

              <div class="brand-section">
                <h5>【永續發展與社會責任】</h5>
                <p>堅持合適的耕作節奏，嚴格控管農藥使用且不使用除草劑，以實際行動守護坪林在地保育類野生動物「食蟹獴」的自然棲地，實踐生態共好。同時積極推動產學合作，支持大專院校學生進行茶文化與感官體驗等專題研究，為傳統茶產業注入年輕世代的創新動能。</p>
              </div>
            </div>
          `;
        }

        // 5. 畫面切換：隱藏表單，顯示結果卡片與專屬圖片
        form.style.display = "none";
        mainTitle.innerText = name + " 的專屬茶單";
        subTitle.style.display = "none";
        
        outputDiv.style.display = "block";
        outputDiv.innerHTML = `
          <div style="background-color: #fff; padding: 40px 30px; border: 1px solid var(--border-gray); position: relative; text-align: center;">
            <h3 style="color: var(--ink-green); font-size: 28px; margin: 10px 0;">${teaResult}</h3>
            <div style="width: 40px; height: 2px; background-color: var(--tea-gold); margin: 0 auto 20px;"></div>
            
            <!-- 動態顯示專屬小卡與下載按鈕 -->
            <div class="result-card-container">
              <img src="${resultCardUrl}" alt="${teaResult} 專屬卡片" onerror="this.style.display='none'">
              <br>
              <a href="${resultCardUrl}" download="${cardImageName}" class="download-btn">📥 下載專屬卡片</a>
            </div>
            
            <p style="text-align: justify; line-height: 1.8; color: #444; margin-bottom: 25px; padding: 20px; background-color: rgba(176, 155, 113, 0.05); border-left: 4px solid var(--tea-gold);">
              ${teaReason}
            </p>
            
            <p style="color: #666; font-size: 15px; margin-bottom: 30px;">推薦情境搭配：<strong>${format}</strong></p>
            
            <hr style="border: 0; border-top: 1px dashed var(--border-gray); margin: 30px 0;">
            
            <h4 style="color: var(--ink-green); margin-bottom: 15px; font-size: 18px;">👇 專屬沖泡指南 👇</h4>
            <div class="guide-box">
              ${guideHtml}
            </div>

            <!-- 動態品牌介紹區塊 -->
            ${brandIntroHtml}
            
            <!-- 加入寄信狀態提示 -->
            <p id="mailStatus" style="color: #888; font-size: 13px; margin-top: 20px;">⏳ 正在將茶單發送至您的信箱...</p>
            
            <button onclick="location.reload()" class="submit-btn" style="background-color: transparent; color: var(--ink-green); border: 1px solid var(--ink-green); margin-top: 10px;">重新品茗</button>
            
            <div class="manufacturer-info">
              <strong>製造商資訊</strong><br>
              鑫利發茶園<br>
              品牌：嗜茶人
            </div>
          </div>
        `;

        // 6. 透過 fetch 在背景將資料傳送給 GAS 執行寄信與資料庫寫入
        var urlEncodedData = new URLSearchParams({
          name: name,
          email: emailInput,
          taste: taste,
          brew: brew,
          format: format,
          roast: roast,
          expectation: expectation
        }).toString();

        var API_URL = "https://script.google.com/macros/s/AKfycbxXAqIpbe-QxKVzD-DcLGIKFKsajcosWtBXNzYDBvJe1g-9AEMz1R5BHR877X4_gPz4Fw/exec"; 

        fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded" 
          },
          body: urlEncodedData
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('網路回應異常');
          }
          return response.json(); 
        })
        .then(data => {
          var mailStatus = document.getElementById('mailStatus');
          if(data.status === "success") {
            mailStatus.innerText = "✅ " + data.message;
            mailStatus.style.color = "var(--ink-green)";
          } else {
            mailStatus.innerText = "❌ 寄信失敗：" + data.message;
            mailStatus.style.color = "red";
          }
        })
        .catch(error => {
          var mailStatus = document.getElementById('mailStatus');
          mailStatus.innerText = "❌ 系統連線異常，無法寄送信件。";
          mailStatus.style.color = "red";
          console.error("Fetch 錯誤:", error);
        });
      }
    </script>
  </body>
</html>
