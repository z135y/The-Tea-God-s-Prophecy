<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>創新創業社 - 專屬風味占卜</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&display=swap');
      
      :root { 
        --ink-green: #2F3E35; --ink-black: #222222; --tea-gold: #B09B71; 
        --paper-bg: #F4F1EA; --stamp-red: #A93828; --border-gray: rgba(213, 207, 196, 0.6); 
      }
      
      body { 
        font-family: 'Noto Serif TC', '微軟正黑體', serif; background-color: var(--paper-bg); 
        background-image: 
          url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"), 
          linear-gradient(to right, var(--border-gray) 1px, transparent 1px), 
          linear-gradient(to bottom, var(--border-gray) 1px, transparent 1px); 
        background-size: 100px 100px, 60px 60px, 60px 60px; background-position: center top; 
        color: var(--ink-black); padding: 50px 20px; margin: 0; 
        display: flex; justify-content: center; overflow-x: hidden; position: relative; 
      }
      
      .leaves-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
      .leaf { 
        position: absolute; width: 35px; height: 35px; 
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232F3E35' opacity='0.15'><path d='M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C14,8 16.25,9.75 17,8Z'/></svg>"); 
        background-size: contain; background-repeat: no-repeat; 
        animation: sway 12s ease-in-out infinite, fall 18s linear infinite; 
      }
      @keyframes sway { 0%, 100% { transform: translateX(0) rotate(0deg); } 50% { transform: translateX(60px) rotate(45deg); } }
      @keyframes fall { 0% { top: -10%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 110%; opacity: 0; } }
      .leaf:nth-child(1) { left: 15%; animation-delay: 0s, 0s; transform: scale(0.9); } 
      .leaf:nth-child(2) { left: 35%; animation-delay: 3s, 5s; transform: scale(1.3); } 
      .leaf:nth-child(3) { left: 60%; animation-delay: 6s, 2s; transform: scale(0.8); } 
      .leaf:nth-child(4) { left: 80%; animation-delay: 9s, 7s; transform: scale(1.1); } 
      .leaf:nth-child(5) { left: 95%; animation-delay: 2s, 11s; transform: scale(1); }
      
      .tea-master-illustration { position: fixed; bottom: 0; left: 2%; width: 350px; height: 350px; pointer-events: none; z-index: 0; opacity: 0.85; }
      @keyframes pour { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      @keyframes steam-rise { 0% { transform: translateY(0) scale(0.8); opacity: 0; } 50% { opacity: 0.6; } 100% { transform: translateY(-20px) scale(1.2); opacity: 0; } }
      .water-stream { stroke-dasharray: 6 4; animation: pour 0.8s linear infinite; } 
      .steam-wave { animation: steam-rise 3s ease-in-out infinite; transform-origin: center bottom; } .steam-wave:nth-child(2) { animation-delay: 1.5s; }
      
      .container { 
        background-color: rgba(253, 252, 248, 0.95); backdrop-filter: blur(8px); 
        max-width: 550px; width: 100%; padding: 50px 40px; position: relative; 
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08); border: 1px solid var(--border-gray); z-index: 1; 
      }
      .container::before, .container::after { content: ''; position: absolute; width: 30px; height: 30px; border: 1px solid var(--tea-gold); } 
      .container::before { top: 15px; left: 15px; border-right: none; border-bottom: none; } 
      .container::after { bottom: 15px; right: 15px; border-left: none; border-top: none; }
      
      .stamp { 
        position: absolute; top: 30px; right: 30px; width: 32px; height: 110px; 
        background-color: var(--stamp-red); color: white; font-family: 'Noto Serif TC', serif; 
        font-weight: 900; font-size: 16px; writing-mode: vertical-rl; text-align: center; 
        letter-spacing: 2px; display: flex; align-items: center; justify-content: center; 
        border-radius: 2px; opacity: 0.85; 
        z-index: 2;
      }
      
      .brand-watermark-logo {
        display: none; /* 完全隱藏原本的鑫利發茶園圓形浮水印 */
      }
      
      h2 { text-align: center; color: var(--ink-green); font-size: 28px; margin-top: 10px; margin-bottom: 15px; letter-spacing: 3px; font-weight: 600; }
      .subtitle { text-align: center; font-size: 15px; color: #666; margin-bottom: 40px; line-height: 1.8; letter-spacing: 1px; transition: 0.3s; }
      
      /* UI/UX 優化：步驟與卡片樣式 */
      .step-container { display: none; animation: slideInUp 0.5s ease-out forwards; }
      .step-container.active { display: block; }
      @keyframes slideInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      
      .progress-wrapper { width: 100%; height: 6px; background-color: var(--border-gray); margin-bottom: 30px; border-radius: 3px; overflow: hidden; display: none;}
      .progress-bar { height: 100%; background-color: var(--ink-green); width: 0%; transition: width 0.4s ease; border-radius: 3px;}
      
      .form-group { margin-bottom: 30px; text-align: left; }
      .form-group label { display: block; font-weight: 600; margin-bottom: 15px; font-size: 17px; color: var(--ink-green); letter-spacing: 1px; line-height: 1.4; }
      
      input[type="text"], input[type="email"] { 
        width: 100%; padding: 12px 10px; box-sizing: border-box; border: none; 
        border-bottom: 1px solid var(--border-gray); border-radius: 0; font-size: 16px; 
        background-color: transparent; color: var(--ink-black); font-family: 'Noto Serif TC', serif; 
        transition: all 0.3s ease; 
      }
      input:focus { outline: none; border-bottom: 2px solid var(--ink-green); }

      .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
      .options-grid.col-1 { grid-template-columns: 1fr; }
      
      .option-card {
        border: 1px solid var(--border-gray); background-color: rgba(255,255,255,0.7);
        border-radius: 8px; padding: 20px 15px; cursor: pointer; text-align: center;
        transition: all 0.25s ease; color: var(--ink-black); font-size: 15px; font-weight: 600; letter-spacing: 1px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        min-height: 80px; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      }
      .option-card:hover { border-color: var(--tea-gold); background-color: rgba(176, 155, 113, 0.1); transform: translateY(-2px); }
      .option-card.selected { border-color: var(--ink-green); background-color: var(--ink-green); color: var(--paper-bg); box-shadow: 0 4px 12px rgba(47, 62, 53, 0.2); transform: scale(0.98); }
      
      .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }
      .btn-prev { background: transparent; border: 1px solid var(--border-gray); color: #666; padding: 12px 20px; font-family: inherit; font-size: 16px; cursor: pointer; transition: 0.3s; flex: 1; font-weight: 600; border-radius: 4px; }
      .btn-prev:hover { background: #eee; }
      .btn-next { background: var(--ink-green); border: 1px solid var(--ink-green); color: var(--paper-bg); padding: 12px 20px; font-family: inherit; font-size: 16px; cursor: pointer; transition: 0.3s; flex: 2; font-weight: 600; letter-spacing: 2px; border-radius: 4px; }
      .btn-next:hover { background: transparent; color: var(--ink-green); }
      .btn-next:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; color: #fff; }
      
      button.submit-btn, a.action-btn { 
        display: block; box-sizing: border-box; text-align: center; text-decoration: none;
        background-color: var(--ink-green); color: var(--paper-bg); padding: 16px 20px; 
        border: 1px solid var(--ink-green); cursor: pointer; width: 100%; font-size: 18px; 
        font-family: 'Noto Serif TC', serif; letter-spacing: 4px; font-weight: 600; 
        transition: all 0.4s; margin-top: 20px; 
      }
      button.submit-btn:hover, a.action-btn:hover { background-color: transparent; color: var(--ink-green); }
      
      a.action-btn-outline {
        display: block; box-sizing: border-box; text-align: center; text-decoration: none;
        background-color: transparent; color: var(--ink-green); padding: 16px 20px; 
        border: 1px solid var(--ink-green); cursor: pointer; width: 100%; font-size: 16px; 
        font-family: 'Noto Serif TC', serif; letter-spacing: 2px; font-weight: 600; 
        transition: all 0.4s; 
      }
      a.action-btn-outline:hover { background-color: var(--ink-green); color: var(--paper-bg); }

      #output { display: none; animation: fadeIn 0.8s ease-in; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      
      .audio-controller { 
        position: fixed; bottom: 30px; right: 30px; background-color: var(--paper-bg); 
        border: 1px solid var(--tea-gold); color: var(--ink-green); padding: 12px 18px; 
        border-radius: 40px; font-size: 14px; font-family: 'Noto Serif TC', serif; 
        font-weight: bold; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
        transition: all 0.3s ease; z-index: 10; display: flex; align-items: center; gap: 8px; 
      }
      .audio-controller:hover { background-color: var(--ink-green); color: var(--paper-bg); border-color: var(--ink-green); }

      .guide-box {
        text-align: left; background-color: rgba(253, 252, 248, 0.8); border: 1px solid var(--tea-gold); 
        padding: 20px; margin-bottom: 25px; border-radius: 4px; font-size: 15px; line-height: 1.8;
      }
      .guide-box ul { margin: 10px 0 0; padding-left: 20px; color: #444; }
      .guide-box li { margin-bottom: 8px; }
      
      .result-card-container { margin: 20px 0 30px; text-align: center; }
      .result-card-container img {
        max-width: 100%; height: auto; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        transition: transform 0.3s ease;
      }
      .result-card-container img:hover { transform: translateY(-5px); }
      
      .download-btn {
        display: inline-block; margin-top: 15px; padding: 10px 20px; 
        background-color: var(--tea-gold); color: #fff; text-decoration: none; 
        border-radius: 4px; font-size: 15px; letter-spacing: 2px; 
        transition: 0.3s; box-shadow: 0 4px 10px rgba(176, 155, 113, 0.3);
      }
      .download-btn:hover { background-color: var(--ink-green); color: #fff; }

      details.brand-accordion {
        background-color: rgba(248, 249, 250, 0.85); border-radius: 6px; 
        border-top: 4px solid var(--ink-green); margin: 35px 0; text-align: left;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: all 0.3s ease;
      }
      details.brand-accordion summary {
        padding: 18px 20px; font-size: 16px; font-weight: 600; color: var(--ink-green);
        cursor: pointer; letter-spacing: 1px; outline: none; list-style: none;
        display: flex; justify-content: space-between; align-items: center;
      }
      details.brand-accordion summary::-webkit-details-marker { display: none; }
      details.brand-accordion summary::after {
        content: '+'; font-size: 24px; font-weight: 400; color: var(--tea-gold);
        transition: transform 0.3s ease;
      }
      details.brand-accordion[open] summary::after { content: '−'; }
      
      .brand-accordion-content {
        padding: 0 20px 25px 20px; border-top: 1px dashed var(--border-gray);
        margin-top: -5px; padding-top: 20px; animation: slideDown 0.3s ease-out;
      }
      @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
      
      .brand-section { margin-bottom: 18px; }
      .brand-section:last-child { margin-bottom: 0; }
      .brand-section h5 { margin: 0 0 5px 0; color: var(--tea-gold); font-size: 15px; letter-spacing: 1px; }
      .brand-section p { margin: 0; color: #444; font-size: 14px; line-height: 1.8; text-align: justify; }

      @media (max-width: 900px) { 
        .tea-master-illustration { opacity: 0.15; left: -50px; } 
        /* 確保手機版也不會顯示浮水印 */
        .brand-watermark-logo { display: none; }
      }
      @media (max-width: 600px) { .container { padding: 40px 25px; } .stamp { top: 20px; right: 20px; width: 28px; height: 95px; font-size: 14px; } }
    </style>
  </head>
  <body>

    <!-- 大自然樹葉背景 -->
    <div class="leaves-container">
      <div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div><div class="leaf"></div>
    </div>
    
    <!-- 司茶人插圖 -->
    <svg class="tea-master-illustration" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path class="steam-wave" d="M305,210 Q315,180 295,150" stroke="#B09B71" stroke-width="2" stroke-linecap="round"/>
      <path class="steam-wave" d="M325,220 Q340,190 320,160" stroke="#B09B71" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M290,340 L340,340 C345,340 350,330 345,310 C340,290 295,290 290,310 C285,330 285,340 290,340 Z" stroke="#2F3E35" stroke-width="2.5" stroke-linejoin="round"/>
      <path class="water-stream" d="M275,270 Q285,300 310,325" stroke="#B09B71" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M220,240 C210,210 260,210 270,240 C280,270 200,270 220,240 Z" stroke="#2F3E35" stroke-width="3" stroke-linejoin="round"/>
      <path d="M265,245 Q285,240 285,265" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M215,245 Q195,250 205,270" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M60,400 C60,330 110,270 180,270 C200,270 210,275 220,285" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M120,270 C150,250 180,250 205,265" stroke="#2F3E35" stroke-width="2" stroke-linecap="round"/>
      <path d="M50,400 C50,290 80,180 120,150 C140,135 170,135 180,165 C185,180 170,195 160,205" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M120,150 C110,130 125,100 155,95 C175,90 190,110 180,135" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M180,165 Q195,175 185,195 L170,210" stroke="#2F3E35" stroke-width="3" stroke-linecap="round"/>
      <path d="M165,155 Q175,155 175,160" stroke="#2F3E35" stroke-width="2" stroke-linecap="round"/> 
    </svg>
    
    <button class="audio-controller" id="audioBtn" onclick="toggleAudio()">
      <span id="audioIcon">🌿</span> <span id="audioText">聆聽茶園微風</span>
    </button>

    <div class="container">
      <!-- 雖然保留了 img 標籤，但透過 CSS 將其隱藏 -->
      <img src="./brand_logo.png" class="brand-watermark-logo" alt="品牌浮水印">
      
      <div class="stamp" id="stampMarker">創新創業社</div>
      <h2 id="mainTitle">尋找專屬茶韻</h2>
      <p class="subtitle" id="subTitle">透過五個簡單的直覺選擇，為此時此刻的您，配對最適合的台灣茶。</p>
      
      <!-- 進度條 -->
      <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      
      <!-- 測驗表單 (UI/UX 步驟化設計) -->
      <form id="teaForm" onsubmit="handleFormSubmit(event)">
        <!-- 隱藏的輸入欄位，供 JS 與 GAS 使用 -->
        <input type="hidden" name="name" id="val_name">
        <input type="hidden" name="email" id="val_email">
        <input type="hidden" name="brew" id="val_brew">
        <input type="hidden" name="format" id="val_format">
        <input type="hidden" name="taste" id="val_taste">
        <input type="hidden" name="roast" id="val_roast">
        <input type="hidden" name="expectation" id="val_expectation">

        <!-- 步驟 0: 基本資料 -->
        <div class="step-container active" id="step0">
          <div class="form-group">
            <label>請輸入您的稱呼：</label>
            <input type="text" id="input_name" required placeholder="如：王先生 / 李小姐" oninput="checkStep0()">
          </div>
          <div class="form-group">
            <label>接收結果的電子信箱：</label>
            <input type="email" id="input_email" required placeholder="example@email.com" oninput="checkStep0()">
          </div>
          <button type="button" class="btn-next" id="btnNext0" style="width: 100%;" disabled onclick="goToStep(1)">開始靜心占卜</button>
        </div>

        <!-- 步驟 1: 季節 -->
        <div class="step-container" id="step1">
          <div class="form-group">
            <label>一、 您出生（或最喜歡）的季節是？</label>
            <div class="options-grid">
              <div class="option-card" onclick="selectCard(1, 'brew', 'spring', this)">🌸 萬物復甦的春季</div>
              <div class="option-card" onclick="selectCard(1, 'brew', 'summer', this)">☀️ 熱情奔放的夏季</div>
              <div class="option-card" onclick="selectCard(1, 'brew', 'autumn', this)">🍁 涼爽豐收的秋季</div>
              <div class="option-card" onclick="selectCard(1, 'brew', 'winter', this)">❄️ 靜謐沉潛的冬季</div>
            </div>
          </div>
          <div class="nav-buttons">
            <button type="button" class="btn-prev" onclick="goToStep(0)">上一步</button>
          </div>
        </div>

        <!-- 步驟 2: 步調 -->
        <div class="step-container" id="step2">
          <div class="form-group">
            <label>二、 您覺得自己近期的生活步調是？</label>
            <div class="options-grid col-1">
              <div class="option-card" onclick="selectCard(2, 'format', 'fast', this)">快節奏、充滿幹勁，但也容易消耗</div>
              <div class="option-card" onclick="selectCard(2, 'format', 'steady', this)">平穩、按部就班，需要一點變化</div>
              <div class="option-card" onclick="selectCard(2, 'format', 'tired', this)">緩慢、疲憊，需要沉澱與放鬆</div>
            </div>
          </div>
          <div class="nav-buttons">
            <button type="button" class="btn-prev" onclick="goToStep(1)">上一步</button>
          </div>
        </div>

        <!-- 步驟 3: 自然元素 -->
        <div class="step-container" id="step3">
          <div class="form-group">
            <label>三、 直覺選一個目前最吸引您的自然元素？</label>
            <div class="options-grid">
              <div class="option-card" onclick="selectCard(3, 'taste', 'dew', this)">💧 頂層純淨的朝露</div>
              <div class="option-card" onclick="selectCard(3, 'taste', 'breeze', this)">🍃 茶園微涼的清風</div>
              <div class="option-card" onclick="selectCard(3, 'taste', 'sunset', this)">🌅 絢爛溫暖的晚霞</div>
              <div class="option-card" onclick="selectCard(3, 'taste', 'campfire', this)">🔥 深夜安定的營火</div>
            </div>
          </div>
          <div class="nav-buttons">
            <button type="button" class="btn-prev" onclick="goToStep(2)">上一步</button>
          </div>
        </div>

        <!-- 步驟 4: 香氣 -->
        <div class="step-container" id="step4">
          <div class="form-group">
            <label>四、 憑直覺，您現在最想聞到的香氣是？</label>
            <div class="options-grid col-1">
              <div class="option-card" onclick="selectCard(4, 'roast', 'floral', this)">淡雅清新的蘭桂花香</div>
              <div class="option-card" onclick="selectCard(4, 'roast', 'fruity', this)">帶有蜂蜜與熟果的甜香</div>
              <div class="option-card" onclick="selectCard(4, 'roast', 'roasted', this)">經過火候淬鍊的堅果熟香</div>
              <div class="option-card" onclick="selectCard(4, 'roast', 'mint', this)">獨特且強烈的薄荷肉桂香</div>
            </div>
          </div>
          <div class="nav-buttons">
            <button type="button" class="btn-prev" onclick="goToStep(3)">上一步</button>
          </div>
        </div>

        <!-- 步驟 5: 能量 -->
        <div class="step-container" id="step5">
          <div class="form-group">
            <label>五、 您希望接下來為自己注入哪一種能量？</label>
            <div class="options-grid col-1">
              <div class="option-card" onclick="selectCard(5, 'expectation', 'relax', this)">平靜與放鬆，洗滌身心</div>
              <div class="option-card" onclick="selectCard(5, 'expectation', 'clarity', this)">專注與清晰，理清思緒</div>
              <div class="option-card" onclick="selectCard(5, 'expectation', 'soothe', this)">溫暖與撫慰，安定心神</div>
              <div class="option-card" onclick="selectCard(5, 'expectation', 'energy', this)">活力與振奮，迎接挑戰</div>
              <div class="option-card" onclick="selectCard(5, 'expectation', 'stable', this)">踏實與穩定，建立秩序</div>
            </div>
          </div>
          <div class="nav-buttons">
            <button type="button" class="btn-prev" onclick="goToStep(4)">上一步</button>
          </div>
        </div>
      </form>
      
      <!-- 結果顯示區塊 (預設隱藏) -->
      <div id="output"></div>
    </div>

    <script>
      // === 音效播放邏輯 ===
      var music = null; 
      var isPlaying = false;
      var audioBtn = document.getElementById("audioBtn");
      var audioText = document.getElementById("audioText");
      var audioIcon = document.getElementById("audioIcon");

      function toggleAudio() {
        if (!music) {
          music = new Audio("./wind.mp3"); 
          music.loop = true;
          music.volume = 0.3;
        }
        if (isPlaying) {
          music.pause();
          audioText.innerText = "聆聽茶園微風";
          audioIcon.innerText = "🌿";
          isPlaying = false;
        } else {
          music.play().then(function() {
            audioText.innerText = "靜心品茗中";
            audioIcon.innerText = "🎵";
            isPlaying = true;
          }).catch(function(error) {
            alert("系統提示：音效播放失敗。請確認您的裝置或瀏覽器設定允許自動播放。");
          });
        }
      }

      // === UI/UX 步驟切換邏輯 ===
      const totalSteps = 5;
      let currentStep = 0;

      function checkStep0() {
        const name = document.getElementById('input_name').value.trim();
        const email = document.getElementById('input_email').value.trim();
        const btn = document.getElementById('btnNext0');
        // 基本 email 格式驗證
        const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        btn.disabled = !(name && emailValid);
      }

      function goToStep(step) {
        // 進入步驟 1 時，將使用者輸入的值塞入隱藏欄位，供最後一次性發送
        if (step === 1 && currentStep === 0) {
          document.getElementById('val_name').value = document.getElementById('input_name').value;
          document.getElementById('val_email').value = document.getElementById('input_email').value;
          document.getElementById('progressWrapper').style.display = 'block';
        }

        // 隱藏當前畫面並顯示下一個目標畫面
        document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
        const nextTarget = document.getElementById('step' + step);
        if(nextTarget) nextTarget.classList.add('active');
        
        currentStep = step;
        
        // 更新進度條 (從第 1 題開始計算進度)
        const progress = step > 0 ? (step / totalSteps) * 100 : 0;
        document.getElementById('progressBar').style.width = progress + '%';

        // 若超過總題數 (使用者在最後一題點擊選項後延遲觸發)，則直接判定並送出
        if (step > totalSteps) {
          document.getElementById('progressWrapper').style.display = 'none';
          handleFormSubmit({ preventDefault: () => {} });
        }
      }

      function selectCard(stepNum, fieldId, value, element) {
        // 將選擇的數值寫入隱藏欄位
        document.getElementById('val_' + fieldId).value = value;
        
        // 處理視覺選中狀態 (移除其他同層卡片的特效)
        const siblings = element.parentNode.querySelectorAll('.option-card');
        siblings.forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        
        // UX 巧思：選中後短暫延遲 (400毫秒) 再自動翻頁，讓使用者能看清楚自己的選擇
        setTimeout(() => {
          goToStep(stepNum + 1);
        }, 400);
      }

      // === 表單送出與前端畫面渲染邏輯 ===
      function handleFormSubmit(event) {
        event.preventDefault();
        
        var form = document.getElementById('teaForm');
        var outputDiv = document.getElementById('output');
        var mainTitle = document.getElementById('mainTitle');
        var subTitle = document.getElementById('subTitle');
        
        // 1. 改為從隱藏欄位取得使用者最終輸入的值
        var name = document.getElementById('val_name').value;
        var emailInput = document.getElementById('val_email').value;
        var expectation = document.getElementById('val_expectation').value; 
        var roast = document.getElementById('val_roast').value; 
        var taste = document.getElementById('val_taste').value; 
        var brew = document.getElementById('val_brew').value; 
        var format = document.getElementById('val_format').value; 
        
        // 2. 占卜計分邏輯 (客觀對應)
        var scores = { pouchong: 0, oriental: 0, dongding: 0, ruby: 0, highMountain: 0 };
        
        // 核心能量 (權重最高)
        if(expectation === "relax") scores.pouchong += 3;
        else if(expectation === "clarity") scores.highMountain += 3;
        else if(expectation === "soothe") scores.oriental += 3;
        else if(expectation === "energy") scores.ruby += 3;
        else if(expectation === "stable") scores.dongding += 3;

        // 渴望香氣 (次要權重)
        if(roast === "floral") { scores.pouchong += 2; scores.highMountain += 1; }
        else if(roast === "fruity") scores.oriental += 2;
        else if(roast === "roasted") scores.dongding += 2;
        else if(roast === "mint") scores.ruby += 2;

        // 計算最高分的茶款
        var highestScore = -1;
        var finalTeaKey = "pouchong";
        for (var key in scores) {
          if (scores[key] > highestScore) {
            highestScore = scores[key];
            finalTeaKey = key;
          }
        }

        // 3. 設定茶款結果與客觀分析 (基於 TTES 資訊)
        var teaResult = "";
        var teaReason = "";
        var cardImageName = "";
        var guideHtml = "";
        var brandIntroHtml = "";
        
        if (finalTeaKey === "pouchong") {
          teaResult = "文山包種茶 (新北坪林)";
          teaReason = "根據您的選擇，您目前處於需要放鬆與沉澱的狀態。客觀而言，輕發酵的茶飲保留了較多的茶胺酸，有助於舒緩緊繃神經。坪林出產的文山包種茶帶有清幽的蘭桂花香，茶湯清澈甘甜，非常適合用來洗滌疲憊，讓生活步調歸零。";
          cardImageName = "card_baozhong.png";
          guideHtml = `
            <ul>
              <li><strong>水溫：</strong>建議 95°C 熱水。</li>
              <li><strong>比例：</strong>茶水比約 1:50。</li>
              <li><strong>時間：</strong>第一泡 30 秒，第二泡 25 秒，第三泡 30 秒。</li>
            </ul>`;
        } else if (finalTeaKey === "highMountain") {
          teaResult = "阿里山高山烏龍茶";
          teaReason = "您渴望在繁雜的日常中理清思緒。高山茶因生長於海拔1000公尺以上，日夜溫差大使得茶湯富含果膠質且帶有獨特「冷冽高山氣」。適度的咖啡因配合清新的香氣，能協助腦部保持清醒與專注，適合需要冷靜思考的您。";
          cardImageName = "card_highmountain.png";
          guideHtml = `
            <ul>
              <li><strong>水溫：</strong>需使用 100°C 滾水。</li>
              <li><strong>比例：</strong>100cc 水量搭配 6-8g 茶葉。</li>
              <li><strong>時間：</strong>第一泡 120 秒，後續每次增加 60 秒。</li>
            </ul>`;
        } else if (finalTeaKey === "oriental") {
          teaResult = "東方美人茶 (白毫烏龍)";
          teaReason = "您近期可能需要一些溫暖的撫慰。東方美人屬重發酵茶，需經小綠葉蟬叮咬（著涎）產生獨特的天然蜂蜜與熟果香。溫潤不傷胃的特性，配合自然的果蜜甜香，能為您帶來心理上的包覆感，穩定內在能量。";
          cardImageName = "card_oriental.png";
          guideHtml = `
            <ul>
              <li><strong>水溫：</strong>建議 85°C 溫熱水，避免高溫破壞蜜香。</li>
              <li><strong>比例：</strong>茶水比約 1:50。</li>
              <li><strong>時間：</strong>第一泡 40 秒，後續每泡增加 10-15 秒。</li>
            </ul>`;
        } else if (finalTeaKey === "dongding") {
          teaResult = "凍頂烏龍茶 (南投鹿谷)";
          teaReason = "您目前渴望一份安定與踏實的力量。傳統凍頂烏龍經過中度發酵與烘焙工藝，產生梅納反應，帶來堅果、焦糖般的溫暖香氣。醇厚的口感與焙火香，能從感官上傳遞穩定的訊號，適合需要建立生活秩序的您。";
          cardImageName = "card_roastedoolong.png";
          guideHtml = `
            <ul>
              <li><strong>水溫：</strong>建議 95°C - 100°C 沸水。</li>
              <li><strong>比例：</strong>茶葉鋪滿壺底一層即可。</li>
              <li><strong>時間：</strong>首泡 50 秒，後續每泡增加 15 秒，耐沖泡。</li>
            </ul>`;
        } else {
          teaResult = "日月潭紅玉紅茶 (台茶18號)";
          teaReason = "您正處於需要動力、準備迎接挑戰的狀態。紅玉紅茶為全發酵茶，擁有獨特的薄荷與肉桂香氣，被譽為「台灣香」。其豐富的層次與全發酵的溫暖特性，能提振精神，為您補充向前的動能。";
          cardImageName = "card_blacktea.png";
          guideHtml = `
            <ul>
              <li><strong>水溫：</strong>建議 90°C 熱水。</li>
              <li><strong>比例：</strong>茶水比約 1:50。</li>
              <li><strong>時間：</strong>第一泡 30 秒，避免久浸產生澀味。</li>
            </ul>`;
        }

        // 動態生成專屬結果卡的網址
        var resultCardUrl = "./" + cardImageName;

        // 若結果是坪林相關茶款，顯示品牌介紹
        if (finalTeaKey === "pouchong") {
          brandIntroHtml = `
            <details class="brand-accordion">
              <summary>🌿 創新創業社</summary>
              <div class="brand-accordion-content">
                <div class="brand-section">
                  <h5>【社團概述】</h5>
                  <p>這是一個集結了無數創新點子與創業熱情的社群平台。致力將深厚產業知識融合數位化思維，將在地風土與台灣精品推向市場。</p>
                </div>
                <div class="brand-section">
                  <h5>【願景與目標】</h5>
                  <p>為每一個擁有創業夢想的年輕人提供交流、學習與合作的機會，攜手發掘台灣各個角落的美好故事與產品。</p>
                </div>
              </div>
            </details>
          `;
        }

        // 4. 畫面切換：隱藏表單，顯示結果
        form.style.display = "none";
        mainTitle.innerText = name + " 的專屬茶單";
        subTitle.style.display = "none";
        
        outputDiv.style.display = "block";
        outputDiv.innerHTML = `
          <div style="background-color: #fff; padding: 40px 30px; border: 1px solid var(--border-gray); position: relative; text-align: center;">
            <h3 style="color: var(--ink-green); font-size: 28px; margin: 10px 0;">${teaResult}</h3>
            <div style="width: 40px; height: 2px; background-color: var(--tea-gold); margin: 0 auto 20px;"></div>
            
            <div class="result-card-container">
              <img src="${resultCardUrl}" alt="${teaResult} 專屬卡片" onerror="this.style.display='none'">
              <br>
              <a href="${resultCardUrl}" download="${cardImageName}" class="download-btn">📥 下載專屬卡片</a>
            </div>
            
            <p style="text-align: justify; line-height: 1.8; color: #444; margin-bottom: 25px; padding: 20px; background-color: rgba(176, 155, 113, 0.05); border-left: 4px solid var(--tea-gold);">
              <strong>【客觀狀態分析】</strong><br>${teaReason}<br>
              <span style="font-size: 12px; color: #888; display: block; margin-top: 8px;">*風味描述皆參考「農業部茶及飲料作物改良場 (TTES)」之分類標準。</span>
            </p>
            
            <hr style="border: 0; border-top: 1px dashed var(--border-gray); margin: 30px 0;">
            
            <h4 style="color: var(--ink-green); margin-bottom: 15px; font-size: 18px;">👇 專屬沖泡指南 👇</h4>
            <div class="guide-box">
              ${guideHtml}
            </div>

            ${brandIntroHtml}
            
            <p id="mailStatus" style="color: #888; font-size: 13px; margin-top: 20px; margin-bottom: 10px;">⏳ 正在將茶單發送至您的信箱...</p>
            
            <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 25px;">
              <a href="https://www.instagram.com/ie20.24?utm_source=ig_web_button_share_sheet&igsi=ZDNlZDc0MzIxNw==" target="_blank" class="action-btn-outline">💬 追蹤創新創業社社群</a>
              <button onclick="location.reload()" style="background-color: transparent; color: #888; border: none; font-size: 14px; margin-top: 10px; cursor: pointer; text-decoration: underline; font-family: 'Noto Serif TC', serif;">重新品茗測驗</button>
            </div>
          </div>
        `;

        // 5. 透過 fetch 在背景將資料傳送給 GAS (保留您原有的資料欄位以便後端正常運作)
        var urlEncodedData = new URLSearchParams({
          name: name,
          email: emailInput,
          taste: taste,
          brew: brew,
          format: format,
          roast: roast,
          expectation: expectation
        }).toString();

        var API_URL = "https://script.google.com/macros/s/AKfycbxXAqIpbe-QxKVzD-DcLGIKFKsajcosWtBXNzYDBvJe1g-9AEMz1R5BHR877X4_gPz4Fw/exec"; 

        fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: urlEncodedData
        })
        .then(response => {
          if (!response.ok) throw new Error('網路回應異常');
          return response.json(); 
        })
        .then(data => {
          var mailStatus = document.getElementById('mailStatus');
          if(data.status === "success") {
            mailStatus.innerText = "✅ " + data.message;
            mailStatus.style.color = "var(--ink-green)";
          } else {
            mailStatus.innerText = "❌ 寄信失敗：" + data.message;
            mailStatus.style.color = "red";
          }
        })
        .catch(error => {
          var mailStatus = document.getElementById('mailStatus');
          mailStatus.innerText = "❌ 系統連線異常，無法寄送信件。";
          mailStatus.style.color = "red";
          console.error("Fetch 錯誤:", error);
        });
      }
    </script>
  </body>
</html>
